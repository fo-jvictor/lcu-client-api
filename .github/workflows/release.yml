name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build zip
        shell: bash
        run: ./gradlew.bat packageApp -PappVersion="${GITHUB_REF_NAME#v}"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/distributions/LCUClient-*.zip --title "$GITHUB_REF_NAME" --generate-notes
